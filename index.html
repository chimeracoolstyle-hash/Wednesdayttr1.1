<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wednesday</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <!-- HLS (.m3u8) video desteği için Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #070709;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px 30px;
            overflow-x: hidden;
            position: relative;
        }
        
        /* WEDNESDAY Başlığı */
        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3.8rem;
            color: #f3f4f6;
            text-shadow: 0 0 20px rgba(185, 28, 28, 0.7), 0 0 40px rgba(0, 0, 0, 0.95);
            margin-top: 5px;
            margin-bottom: 18px;
            letter-spacing: 6px;
            text-align: center;
            z-index: 3;
            transition: all 0.3s ease;
        }

        /* Player ve Arkasındaki Karakterlerin Taşıyıcı Alanı */
        .stage-wrapper {
            position: relative;
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        /* Sol Taraftaki Kız Görseli */
        .huge-side-girl {
            position: absolute;
            left: -650px; 
            top: 50%;
            transform: translateY(-38%);
            width: 1300px;
            max-height: 1600px;
            object-fit: contain;
            opacity: 0.82;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 35px rgba(0, 0, 0, 0.98)) drop-shadow(0 0 20px rgba(185, 28, 28, 0.45));
        }

        /* Sağ Taraftaki ŞEFFAFLAŞTIRILMIŞ EL Görseli */
        .huge-side-hand {
            position: absolute;
            right: -380px;
            top: 55%;
            transform: translateY(-40%);
            width: 750px;
            max-height: 900px;
            object-fit: contain;
            opacity: 0.35;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.8));
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }

        /* Player Kutusu */
        .main-container {
            width: 100%;
            position: relative;
            z-index: 2;
            background: rgba(15, 15, 20, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.9), 0 0 25px rgba(153, 27, 27, 0.25);
        }

        .video-box {
            width: 100%;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        /* Sezon Butonları & Geri Butonu Alanı */
        .season-buttons, .back-btn-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 950px;
            justify-content: center;
            margin-bottom: 10px;
            z-index: 3;
        }

        /* Koyu Kırmızı / Kan Lekeli Buton Tasarımı */
        .blood-btn {
            position: relative;
            flex: 1;
            padding: 14px 18px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fce7f3;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            background-color: #450a0a;
            background-image: 
                radial-gradient(circle at 15% 25%, rgba(220, 38, 38, 0.8) 0%, transparent 22%),
                radial-gradient(circle at 85% 75%, rgba(185, 28, 28, 0.9) 0%, transparent 28%),
                radial-gradient(ellipse at 50% 120%, rgba(127, 29, 29, 1) 0%, rgba(69, 10, 10, 0.9) 70%),
                linear-gradient(180deg, rgba(136, 19, 19, 0.9) 0%, rgba(40, 5, 5, 0.95) 100%);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.6);
            text-transform: uppercase;
            overflow: hidden;
        }

        .blood-btn:hover {
            border-color: rgba(248, 113, 113, 0.8);
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.6), inset 0 0 10px rgba(185, 28, 28, 0.5);
            transform: translateY(-2px);
            color: #fff;
        }

        .blood-btn.active {
            border-color: #ef4444;
            background-color: #7f1d1d;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        /* Geri Dön Butonu */
        .back-btn {
            background-color: #3b0707;
            border-color: #dc2626;
        }

        /* Bölüm Butonları Alanı */
        .episodes-wrapper {
            width: 100%;
            max-width: 950px;
            min-height: 130px;
            z-index: 3;
        }

        .episodes-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(15, 15, 20, 0.6);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(185, 28, 28, 0.25);
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .episodes-container.visible {
            opacity: 1;
            visibility: visible;
        }

        .episode-btn {
            padding: 11px 8px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #fecaca;
            background: linear-gradient(145deg, rgba(69, 10, 10, 0.85), rgba(20, 5, 5, 0.95));
            border: 1px solid rgba(220, 38, 38, 0.35);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .episode-btn:hover {
            background: linear-gradient(145deg, rgba(153, 27, 27, 0.95), rgba(69, 10, 10, 1));
            border-color: #f87171;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
            color: #fff;
            transform: scale(1.02);
        }

        @media (max-width: 1400px) {
            .huge-side-girl {
                left: -480px;
                width: 900px;
            }
            .huge-side-hand {
                right: -260px;
                width: 550px;
            }
        }

        @media (max-width: 1024px) {
            .huge-side-girl {
                left: -300px;
                width: 650px;
                opacity: 0.5;
            }
            .huge-side-hand {
                right: -180px;
                width: 400px;
                opacity: 0.25;
            }
        }

        @media (max-width: 768px) {
            .huge-side-girl, .huge-side-hand {
                display: none;
            }
            h1 { font-size: 2.3rem; margin-bottom: 15px; }
            .season-buttons { flex-direction: column; }
            .episodes-container { grid-template-columns: repeat(2, 1fr); }
            .episodes-wrapper { min-height: 220px; }
        }
    </style>
</head>
<body>

    <!-- Ana Başlık -->
    <h1 id="mainTitle">WEDNESDAY</h1>

    <!-- Player ve Arkasındaki Karakterler -->
    <div class="stage-wrapper">
        <!-- Sol Kız Görseli -->
        <img src="aaa26-08-29 041209.png" alt="Wednesday Detay" class="huge-side-girl">

        <!-- Şeffaflaştırılmış Sağ El Görseli -->
        <img src="el.png" alt="Thing / El" class="huge-side-hand">

        <!-- Video Player -->
        <div class="main-container">
            <div class="video-box">
                <video id="player" controls autoplay playsinline preload="auto"></video>
            </div>
        </div>
    </div>

    <!-- Sezon Seçim Butonları -->
    <div id="seasonButtonsArea" class="season-buttons">
        <button id="btnSeason1" class="blood-btn" onclick="openSeason(1)">1. SEZON</button>
        <button id="btnSeason2" class="blood-btn" onclick="openSeason(2)">2. SEZON</button>
    </div>

    <!-- Geri Dön Butonu (Bölüm Seçildiğinde Açılır) -->
    <div id="backButtonArea" class="back-btn-container" style="display: none;">
        <button class="blood-btn back-btn" onclick="goBackToHome()">← GERİ DÖN (ANA SAYFA)</button>
    </div>

    <!-- Sabit Bölüm Alanı -->
    <div id="episodesWrapper" class="episodes-wrapper">
        <div id="episodesContainer" class="episodes-container"></div>
    </div>

    <script>
        const INTRO_VIDEO_URL = "https://archive.org/download/wegiris-1/wegiris%20%281%29.mp4";

        // BÖLÜM VİDEO LİNKLERİ LİSTESİ
        const episodesData = {
            "1_1": "https://streaming.disk.yandex.net/hls/U2FsdGVkX1_0oJ-xckI5mjKkHnICe9CnEcY0b2POwkyRb5BEh2NNPib1refHd8MCYTxF6N5C1Um_NUiOqf6v1aBUTc3FfnF24OZuyi85O7eQlWJLb8tdvNo2ol0fCV0uj4icobxSdaEk3x_AoNJ8fspGWzA5bmrtJA51aBk46ALxJuV5IzLHK8TmbsYZmTyaTXwfvk1q0gpGV7UzcXCbbKguXMp3ykEDqyICP9qlVuUsF1V5eOj3z83x3M4Bz_zA08eDfs1WFjY2IR6M9U0bHHIAuz_6hkFXDt6rYC75ZUO_P_EOJMNsi5PNFzkwDzmr6FgTQDZAsOLUQK6Fg3np_tAFQJy7Ko9RY6869dzSh7c/65a40ecadf858/10f573ee9cd57b975d48a25e2e897083ec87549384e65a7fccfb3ffb11678c95/720p/playlist.m3u8?vsid=c469300a41daa5cc07b34ee0febd356e8068f4c79e7cxWEBx4863x1787998353&vpuid=5vmzdwr13w&source_index=0&t=1787998354091&abd=1",
            // Diğer bölümleri bu şekilde ekleyebilirsiniz:
            // "1_2": "https://streaming.disk.yandex.net/hls/U2FsdGVkX1-kUqVJgawCajhB_Int2ezi3GnvmRNm90FLk_OSMCmV1mXmkIcDqH57IXM8n5u--K2f-ElFVoxHEI_RgICqclHWx7PAqXEEAj2PhqrQ33D5beEElegA43kKKMyKmZi-fpAFURpIE-3xR-AvK7R4Ws3GO5H7PF1t1-U4Q00Mf74Tb_lDhmJO3zZYMTIX_Pk8Q7l67jnh_tPSFgXN7pO134lzT_4AzBMAIgIj-2o7CxLOkcuRNgveXZzgZUEgSA2QVj2ZHw4aykP3cVdYp6q0mywyag6sCBsCpGofrpp7RPhwwP802QFPGCJsvlld4CN-Gahy6g3OPtWuA802XAru3n1Uep1VargYhW4/65a424921a4f8/b77aa969ab1c3c242047661d7a139834aab0ac12c9eafbc26ea330f4a0049b40/720p/playlist.m3u8?vsid=47a25276befb567bc790c40d29f3f8270245566526caxWEBx4863x1788004678&vpuid=5vmzdwr13w&source_index=0&t=1788004678985&abd=1",
            // "2_1": "https://..."
        };

        const video = document.getElementById('player');
        const mainTitle = document.getElementById('mainTitle');
        const seasonButtonsArea = document.getElementById('seasonButtonsArea');
        const backButtonArea = document.getElementById('backButtonArea');
        const episodesWrapper = document.getElementById('episodesWrapper');
        const episodesContainer = document.getElementById('episodesContainer');
        const btnSeason1 = document.getElementById('btnSeason1');
        const btnSeason2 = document.getElementById('btnSeason2');

        let hls = null;

        // Video Yükleme ve Oynatma Fonksiyonu (MP4 ve M3U8 desteği ile)
        function loadVideoSource(url) {
            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(() => {});
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play().catch(() => {});
                }
            } else {
                video.src = url;
                video.load();
                video.play().catch(() => {});
            }
        }

        // Açılış videosu
        window.addEventListener('DOMContentLoaded', () => {
            loadVideoSource(INTRO_VIDEO_URL);
        });

        // Sezon Butonları
        function openSeason(seasonNumber) {
            btnSeason1.classList.toggle('active', seasonNumber === 1);
            btnSeason2.classList.toggle('active', seasonNumber === 2);

            episodesContainer.innerHTML = '';
            episodesContainer.classList.add('visible');

            for (let i = 1; i <= 8; i++) {
                const btn = document.createElement('button');
                btn.className = 'episode-btn';
                btn.innerText = `${seasonNumber}. Sezon ${i}. Bölüm`;
                btn.onclick = () => playEpisode(seasonNumber, i);
                episodesContainer.appendChild(btn);
            }
        }

        // Bölüm Başlatma Fonksiyonu
        function playEpisode(season, episode) {
            const key = `${season}_${episode}`;
            const videoUrl = episodesData[key];

            // Başlığı güncelle
            mainTitle.innerText = `${season}. SEZON ${episode}. BÖLÜM`;

            // Butonları gizle, GERİ butonunu göster
            seasonButtonsArea.style.display = 'none';
            episodesWrapper.style.display = 'none';
            backButtonArea.style.display = 'flex';

            if (videoUrl) {
                loadVideoSource(videoUrl);
            } else {
                alert(`${season}. Sezon ${episode}. Bölüm videosu henüz eklenmedi.`);
            }
        }

        // Ana Sayfaya Geri Dön Fonksiyonu
        function goBackToHome() {
            // Başlığı eski haline getir
            mainTitle.innerText = "WEDNESDAY";

            // Sezon ve bölüm butonlarını geri getir, GERİ butonunu gizle
            seasonButtonsArea.style.display = 'flex';
            episodesWrapper.style.display = 'block';
            backButtonArea.style.display = 'none';

            // Giriş videosunu tekrar başlat
            loadVideoSource(INTRO_VIDEO_URL);
        }
    </script>
</body>
</html>
