<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wednesday</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d11;
            background-image: radial-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)), url('el.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }
        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 2.5rem;
            color: #d1d5db;
            text-shadow: 0 0 10px rgba(147, 51, 234, 0.5);
            margin-bottom: 25px;
            letter-spacing: 3px;
        }
        .main-container {
            width: 100%;
            max-width: 900px;
            background: rgba(20, 20, 28, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
        }
        .video-box {
            width: 100%;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <h1>WEDNESDAY</h1>

    <div class="main-container">
        <div class="video-box">
            <video controls autoplay playsinline preload="auto">
                <source src="https://archive.org/download/wegiris-1/wegiris%20%281%29.mp4" type="video/mp4">
                Tarayıcınız video etiketini desteklemiyor.
            </video>
        </div>
    </div>

</body>
</html>
