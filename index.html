<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wednesday - Türkçe Dublaj İzle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px 50px 15px;
    }

    /* Sol Taraftaki Şeffaf Görsel (Wednesday) */
    .bg-side-left {
      position: absolute;
      top: 10px;
      left: 0;
      width: 45%;
      max-width: 520px;
      height: 620px;
      background-image: url('aaa26-08-29%20041209.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%),
                  linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%),
                          linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
      mask-composite: intersect;
      -webkit-mask-composite: destination-in;
    }

    /* Sağ Taraftaki Şeffaf Görsel (el.png / Thing) */
    .bg-side-right {
      position: absolute;
      top: 10px;
      right: 0;
      width: 45%;
      max-width: 520px;
      height: 620px;
      background-image: url('el.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      /* Soldan oynatıcıya ve alta doğru yumuşak erime efekti */
      mask-image: linear-gradient(to left, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%),
                  linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%),
                          linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
      mask-composite: intersect;
      -webkit-mask-composite: destination-in;
    }

    /* Sayfa İçerik Katmanı */
    .content-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
    }

    h1 {
      font-size: 2.4rem;
      color: #e50914;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    p.subtitle {
      font-size: 1rem;
      color: #cfd3dc;
      font-weight: 500;
    }

    /* Video Oynatıcı */
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    /* Bölüm Seçim Butonları */
    .episodes-section {
      width: 100%;
      margin-top: 35px;
    }

    .episodes-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #e6e6e6;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .ep-btn {
      background-color: rgba(20, 23, 34, 0.75);
      backdrop-filter: blur(8px);
      color: #b5bcc9;
      border: 1px solid #2a2e40;
      padding: 14px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: center;
    }

    .ep-btn:hover {
      background-color: #2a2e40;
      color: #ffffff;
      border-color: #4a516d;
    }

    .ep-btn.active {
      background-color: #e50914;
      color: #ffffff;
      border-color: #e50914;
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
    }
  </style>
</head>
<body>

  <div class="bg-side-right"></div>

  <div class="content-wrapper">
    <header>
      <h1>Wednesday</h1>
      <p class="subtitle" id="current-ep-title">1. Sezon 1. Bölüm</p>
    </header>

    <div class="player-container">
      <video id="main-player" playsinline controls preload="metadata">

        Tarayıcınız video etiketini desteklemiyor.
      </video>
    </div>

    <div class="episodes-section">
      <div class="episodes-title">Bölümler</div>
      <div class="episodes-grid">
