<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Oynatıcı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .player-container {
            width: 100%;
            max-width: 960px;
            background: #1f2833;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid #303c4c;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
            outline: none;
        }
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121820;
            border-bottom: 1px solid #303c4c;
        }
        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #66fcf1;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="header">
            <h1>Wednesday - Giriş</h1>
        </div>
        <div class="video-wrapper">
            <video id="introVideo" controls autoplay playsinline preload="auto">
                <source src="https://archive.org/download/wegiris-1/wegiris%20%281%29.mp4" type="video/mp4">
                Tarayıcınız video etiketini desteklemiyor.
            </video>
        </div>
    </div>

    <script>
        const video = document.getElementById('introVideo');

        // Sayfa yüklendiğinde otomatik oynatmayı başlatır (1 kez çalar, döngü/loop yoktur)
        window.addEventListener('DOMContentLoaded', () => {
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // Tarayıcı otomatik sesli oynatmayı engellediyse sessiz başlatmayı dener
                    video.muted = true;
                    video.play();
                });
            }
        });
    </script>
</body>
</html>
