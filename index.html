<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wednesday</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #070709;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px 30px;
            overflow-x: hidden;
            position: relative;
        }
        
        /* WEDNESDAY Başlığı */
        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3.8rem;
            color: #f3f4f6;
            text-shadow: 0 0 20px rgba(185, 28, 28, 0.7), 0 0 40px rgba(0, 0, 0, 0.95);
            margin-top: 5px;
            margin-bottom: 18px;
            letter-spacing: 6px;
            text-align: center;
            z-index: 3;
        }

        /* Player ve Arkasındaki Karakterlerin Taşıyıcı Alanı */
        .stage-wrapper {
            position: relative;
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        /* Sol Taraftaki Kız Görseli */
        .huge-side-girl {
            position: absolute;
            left: -650px; 
            top: 50%;
            transform: translateY(-38%);
            width: 1300px;
            max-height: 1600px;
            object-fit: contain;
            opacity: 0.82;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 35px rgba(0, 0, 0, 0.98)) drop-shadow(0 0 20px rgba(185, 28, 28, 0.45));
        }

        /* Sağ Taraftaki ŞEFFAFLAŞTIRILMIŞ EL (Thing) Görseli */
        .huge-side-hand {
            position: absolute;
            right: -380px;
            top: 55%;
            transform: translateY(-40%);
            width: 750px;
            max-height: 900px;
            object-fit: contain;
            opacity: 0.35; /* Şeffaflık derecesi artırıldı */
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.8));
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }

        /* Player Kutusu */
        .main-container {
            width: 100%;
            position: relative;
            z-index: 2;
            background: rgba(15, 15, 20, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.9), 0 0 25px rgba(153, 27, 27, 0.25);
        }

        .video-box {
            width: 100%;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        /* Sezon Butonları */
        .season-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 950px;
            justify-content: center;
            margin-bottom: 10px;
            z-index: 3;
        }

        /* Koyu Kırmızı / Kan Lekeli Buton Tasarımı */
        .blood-btn {
            position: relative;
            flex: 1;
            padding: 14px 18px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fce7f3;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            background-color: #450a0a;
            background-image: 
                radial-gradient(circle at 15% 25%, rgba(220, 38, 38, 0.8) 0%, transparent 22%),
                radial-gradient(circle at 85% 75%, rgba(185, 28, 28, 0.9) 0%, transparent 28%),
                radial-gradient(ellipse at 50% 120%, rgba(127, 29, 29, 1) 0%, rgba(69, 10, 10, 0.9) 70%),
                linear-gradient(180deg, rgba(136, 19, 19, 0.9) 0%, rgba(40, 5, 5, 0.95) 100%);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.6);
            text-transform: uppercase;
            overflow: hidden;
        }

        .blood-btn:hover {
            border-color: rgba(248, 113, 113, 0.8);
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.6), inset 0 0 10px rgba(185, 28, 28, 0.5);
            transform: translateY(-2px);
            color: #fff;
        }

        .blood-btn.active {
            border-color: #ef4444;
            background-color: #7f1d1d;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        /* Bölüm Butonları Alanı */
        .episodes-wrapper {
            width: 100%;
            max-width: 950px;
            min-height: 130px;
            z-index: 3;
        }

        .episodes-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(15, 15, 20, 0.6);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(185, 28, 28, 0.25);
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .episodes-container.visible {
            opacity: 1;
            visibility: visible;
        }

        .episode-btn {
            padding: 11px 8px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #fecaca;
            background: linear-gradient(145deg, rgba(69, 10, 10, 0.85), rgba(20, 5, 5, 0.95));
            border: 1px solid rgba(220, 38, 38, 0.35);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .episode-btn:hover {
            background: linear-gradient(145deg, rgba(153, 27, 27, 0.95), rgba(69, 10, 10, 1));
            border-color: #f87171;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
            color: #fff;
            transform: scale(1.02);
        }

        @media (max-width: 1400px) {
            .huge-side-girl {
                left: -480px;
                width: 900px;
            }
            .huge-side-hand {
                right: -260px;
                width: 550px;
            }
        }

        @media (max-width: 1024px) {
            .huge-side-girl {
                left: -300px;
                width: 650px;
                opacity: 0.5;
            }
            .huge-side-hand {
                right: -180px;
                width: 400px;
                opacity: 0.25;
            }
        }

        @media (max-width: 768px) {
            .huge-side-girl, .huge-side-hand {
                display: none;
            }
            h1 { font-size: 2.3rem; margin-bottom: 15px; }
            .season-buttons { flex-direction: column; }
            .episodes-container { grid-template-columns: repeat(2, 1fr); }
            .episodes-wrapper { min-height: 220px; }
        }
    </style>
</head>
<body>

    <h1>WEDNESDAY</h1>

    <!-- Player ve Arkasındaki Karakterler -->
    <div class="stage-wrapper">
        <!-- Sol Kız Görseli -->
        <img src="aaa26-08-29 041209.png" alt="Wednesday Detay" class="huge-side-girl">

        <!-- Şeffaflaştırılmış Sağ El Görseli -->
        <img src="el.png" alt="Thing / El" class="huge-side-hand">

        <!-- Video Player -->
        <div class="main-container">
            <div class="video-box">
                <video id="player" controls autoplay playsinline preload="auto">
                    <source id="videoSource" src="https://archive.org/download/wegiris-1/wegiris%20%281%29.mp4" type="video/mp4">
                    Tarayıcınız video etiketini desteklemiyor.
                </video>
            </div>
        </div>
    </div>

    <!-- Sezon Seçim Butonları -->
    <div class="season-buttons">
        <button id="btnSeason1" class="blood-btn" onclick="openSeason(1)">1. SEZON</button>
        <button id="btnSeason2" class="blood-btn" onclick="openSeason(2)">2. SEZON</button>
    </div>

    <!-- Sabit Bölüm Alanı -->
    <div class="episodes-wrapper">
        <div id="episodesContainer" class="episodes-container"></div>
    </div>

    <script>
        const video = document.getElementById('player');
        const episodesContainer = document.getElementById('episodesContainer');
        const btnSeason1 = document.getElementById('btnSeason1');
        const btnSeason2 = document.getElementById('btnSeason2');

        video.muted = false;
        video.volume = 1.0;

        window.addEventListener('DOMContentLoaded', () => {
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    video.muted = true;
                    video.play();
                    
                    const enableAudio = () => {
                        video.muted = false;
                        document.removeEventListener('click', enableAudio);
                        document.removeEventListener('touchstart', enableAudio);
                    };
                    document.addEventListener('click', enableAudio);
                    document.addEventListener('touchstart', enableAudio);
                });
            }
        });

        function openSeason(seasonNumber) {
            btnSeason1.classList.toggle('active', seasonNumber === 1);
            btnSeason2.classList.toggle('active', seasonNumber === 2);

            episodesContainer.innerHTML = '';
            episodesContainer.classList.add('visible');

            for (let i = 1; i <= 8; i++) {
                const btn = document.createElement('button');
                btn.className = 'episode-btn';
                btn.innerText = `${seasonNumber}. Sezon ${i}. Bölüm`;
                btn.onclick = () => playEpisode(seasonNumber, i);
                episodesContainer.appendChild(btn);
            }
        }

        function playEpisode(season, episode) {
            console.log(`Sezon ${season}, Bölüm ${episode} seçildi.`);
        }
    </script>
</body>
</html>
