<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wednesday - Türkçe Dublaj İzle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px 50px 15px;
    }

    /* Sola Yaslı, Genişletilmiş ve Yarı Saydam (Transparan) Arka Plan Resmi */
    .left-translucent-bg {
      position: absolute;
      top: 0;
      left: -80px;                 /* Sola doğru kaydırma */
      width: 65%;                  /* Genişlik */
      height: 600px;               /* Yükseklik */
      background-image: url('aaa26-08-29%20041209.png');
      background-size: cover;
      background-position: left center;
      background-repeat: no-repeat;
      opacity: 0.35;               /* Şeffaflık / Transparanlık oranı */
      pointer-events: none;
      z-index: 0;
      /* Sağa ve aşağıya doğru yumuşak saydamlaşma efekti */
      mask-image: radial-gradient(circle at 20% 35%, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
      -webkit-mask-image: radial-gradient(circle at 20% 35%, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
    }

    /* Sayfa İçerik Katmanı */
    .content-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
    }

    h1 {
      font-size: 2.4rem;
      color: #e50914;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    p.subtitle {
      font-size: 1rem;
      color: #cfd3dc;
      font-weight: 500;
    }

    /* Video Oynatıcı */
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    /* Bölüm Seçim Butonları */
    .episodes-section {
      width: 100%;
      margin-top: 35px;
    }

    .episodes-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #e6e6e6;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .ep-btn {
      background-color: rgba(20, 23, 34, 0.75);
      backdrop-filter: blur(8px);
      color: #b5bcc9;
      border: 1px solid #2a2e40;
      padding: 14px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: center;
    }

    .ep-btn:hover {
      background-color: #2a2e40;
      color: #ffffff;
      border-color: #4a516d;
    }

    .ep-btn.active {
      background-color: #e50914;
      color: #ffffff;
      border-color: #e50914;
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
    }
  </style>
</head>
<body>

  <!-- Sola Kaydırılmış Şeffaf Arka Plan Resmi -->
  <div class="left-translucent-bg"></div>

  <!-- Ön Plandaki Sayfa İçeriği -->
  <div class="content-wrapper">
    <header>
      <h1>Wednesday</h1>
      <p class="subtitle" id="current-ep-title">1. Sezon 1. Bölüm</p>
    </header>

    <!-- Video Oynatıcı -->
    <div class="player-container">
      <video id="main-player" playsinline controls preload="metadata">
        <source id="video-source" src="https://github.com/chimeracoolstyle-hash/Wednesdayttr1.1/releases/download/v1.0/Wednesday.1.Sezon.1.Bolum.izle.coolstylerip.mp4" type="video/mp4" />
        Tarayıcınız video etiketini desteklemiyor.
      </video>
    </div>

    <!-- Bölümler -->
    <div class="episodes-section">
      <div class="episodes-title">Bölümler</div>
      <div class="episodes-grid">
        <button class="ep-btn active" onclick="changeEpisode('https://github.com/chimeracoolstyle-hash/Wednesdayttr1.1/releases/download/v1.0/Wednesday.1.Sezon.1.Bolum.izle.coolstylerip.mp4', '1. Sezon 1. Bölüm', this)">1. Bölüm</button>
        <button class="ep-btn" onclick="changeEpisode('BURAYA_2_BOLUM_LINKI', '1. Sezon 2. Bölüm', this)">2. Bölüm</button>
        <button class="ep-btn" onclick="changeEpisode('BURAYA_3_BOLUM_LINKI', '1. Sezon 3. Bölüm', this)">3. Bölüm</button>
        <button class="ep-btn" onclick="changeEpisode('BURAYA_4_BOLUM_LINKI', '1. Sezon 4. Bölüm', this)">4. Bölüm</button>
        <button class="ep-btn" onclick="changeEpisode('BURAYA_5_BOLUM_LINKI', '1. Sezon 5. Bölüm', this)">5. Bölüm</button>
      </div>
    </div>
  </div>

  <script>
    function changeEpisode(videoUrl, episodeTitle, buttonElement) {
      const player = document.getElementById('main-player');
      const source = document.getElementById('video-source');
      
      source.src = videoUrl;
      player.load();
      player.play();
      
      document.getElementById('current-ep-title').textContent = episodeTitle;
      const allButtons = document.querySelectorAll('.ep-btn');
      allButtons.forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');
    }
  </script>

</body>
</html>
