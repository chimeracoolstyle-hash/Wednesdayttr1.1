<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wednesday</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d11;
            background-image: radial-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)), url('el.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px;
        }
        
        /* WEDNESDAY Başlığı - Büyütüldü */
        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 4rem;
            color: #f3f4f6;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.7), 0 0 40px rgba(0, 0, 0, 0.9);
            margin-bottom: 50px;
            letter-spacing: 6px;
            text-align: center;
        }

        /* Player Kutusu - Aşağı Kaydırıldı */
        .main-container {
            width: 100%;
            max-width: 950px;
            background: rgba(20, 20, 28, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.8), 0 0 25px rgba(147, 51, 234, 0.2);
            margin-bottom: 35px;
        }

        .video-box {
            width: 100%;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        /* Sezon Butonları Alanı */
        .season-buttons {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 950px;
            justify-content: center;
        }

        .season-btn {
            flex: 1;
            padding: 18px 24px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #f3f4f6;
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.8), rgba(30, 27, 75, 0.9));
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            text-transform: uppercase;
        }

        .season-btn:hover {
            background: linear-gradient(135deg, rgba(126, 34, 206, 0.9), rgba(59, 7, 100, 1));
            border-color: rgba(192, 132, 252, 0.8);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .season-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
                margin-bottom: 30px;
            }
            .season-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>WEDNESDAY</h1>

    <div class="main-container">
        <div class="video-box">
            <video id="player" controls autoplay playsinline preload="auto">
                <source src="https://archive.org/download/wegiris-1/wegiris%20%281%29.mp4" type="video/mp4">
                Tarayıcınız video etiketini desteklemiyor.
            </video>
        </div>
    </div>

    <div class="season-buttons">
        <button class="season-btn" onclick="selectSeason(1)">1. SEZON</button>
        <button class="season-btn" onclick="selectSeason(2)">2. SEZON</button>
    </div>

    <script>
        const video = document.getElementById('player');

        window.addEventListener('DOMContentLoaded', () => {
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    video.muted = true;
                    video.play();
                });
            }
        });

        function selectSeason(seasonNumber) {
            console.log(seasonNumber + ". Sezon seçildi.");
            // İleride bölüm listesini açmak veya video değiştirmek için burayı kullanabilirsiniz
        }
    </script>
</body>
</html>
