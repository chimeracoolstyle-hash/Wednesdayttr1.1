<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wednesday - Türkçe Dublaj İzle</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 15px 50px 15px;
    }

    /* Sol Taraftaki Şeffaf Görsel (Wednesday) */
    .bg-side-left {
      position: absolute;
      top: 10px;
      left: 0;
      width: 45%;
      max-width: 520px;
      height: 620px;
      background-image: url('aaa26-08-29%20041209.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%),
                  linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%),
                          linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
      mask-composite: intersect;
      -webkit-mask-composite: destination-in;
    }

    /* Sağ Taraftaki Şeffaf Görsel (el.png) */
    .bg-side-right {
      position: absolute;
      top: 10px;
      right: 0;
      width: 45%;
      max-width: 520px;
      height: 620px;
      background-image: url('el.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      mask-image: linear-gradient(to left, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%),
                  linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%),
                          linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
      mask-composite: intersect;
      -webkit-mask-composite: destination-in;
    }

    /* Sayfa İçerik Katmanı */
    .content-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Daha Büyük, Şekilli ve Daha Transparan Başlık */
    h1.main-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 4.2rem;               /* Daha büyük boyut */
      font-weight: 900;
      color: rgba(229, 9, 20, 0.65);   /* Belirgin şekilde daha transparan kırmızı */
      letter-spacing: 8px;             /* Genişletilmiş harf aralığı */
      text-transform: uppercase;
      /* Hafif ve yumuşak gotik neon gölge efekti */
      text-shadow: 0 0 25px rgba(229, 9, 20, 0.35), 
                   0 0 50px rgba(229, 9, 20, 0.15), 
                   0 4px 15px rgba(0, 0, 0, 0.9);
      margin: 0;
      transition: all 0.3s ease;
    }

    h1.main-title:hover {
      color: rgba(229, 9, 20, 0.85);
      text-shadow: 0 0 30px rgba(229, 9, 20, 0.6), 
                   0 0 60px rgba(229, 9, 20, 0.3);
    }

    /* Video Oynatıcı */
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    /* Bölüm Seçim Butonları */
    .episodes-section {
      width: 100%;
      margin-top: 35px;
    }

    .episodes-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #e6e6e6;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .ep-btn {
      background-color: rgba(20, 23, 34, 0.75);
      backdrop-filter: blur(8px);
      color: #b5bcc9;
      border: 1px solid #2a2e40;
      padding: 14px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: center;
    }

    .ep-btn:hover {
      background-color: #2a2e40;
      color: #ffffff;
      border-color: #4a516d;
    }

    .ep-btn.active {
      background-color: #e50914;
      color: #ffffff;
      border-color: #e50914;
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
    }

    @media (max-width: 600px) {
      h1.main-title {
        font-size: 2.4rem;
        letter-spacing: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-side-left"></div>
  <div class="bg-side-right"></div>

  <div class="content-wrapper">
    <header>
      <h1 class="main-title">Wednesday</h1>
    </header>

    <div class="player-container">
      <video id="main-player" playsinline controls autoplay muted preload="auto">
        <source id="video-source" src="https://ia600105.us.archive.org/6/items/ww_20260829/ww.mp4" type="video/mp4" />
        Tarayıcınız video etiketini desteklemiyor.
      </video>
    </div>

    <div class="episodes-section">
      <div class="episodes-title">Bölümler</div>
      <div class="episodes-grid">
        <button class="ep-btn active" onclick="changeEpisode('https://ia600105.us.archive.org/6/items/ww_20260829/ww.mp4', this)">1. Bölüm</button>
        <button class="ep-btn" onclick="changeEpisode('BURAYA_2_BOLUM_LINKI', this)">2. Bölüm</button>
        <button class="ep-btn" onclick="changeEpisode('BURAYA_3_BOLUM_LINKI', this)">3. Bölüm</button>
        <button class="ep-btn" onclick="changeEpisode('BURAYA_4_BOLUM_LINKI', this)">4. Bölüm</button>
        <button class="ep-btn" onclick="changeEpisode('BURAYA_5_BOLUM_LINKI', this)">5. Bölüm</button>
      </div>
    </div>
  </div>

  <script>
    function changeEpisode(videoUrl, buttonElement) {
      const player = document.getElementById('main-player');
      const source = document.getElementById('video-source');
      
      source.src = videoUrl;
      player.load();
      player.play();
      
      const allButtons = document.querySelectorAll('.ep-btn');
      allButtons.forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');
    }
  </script>

</body>
</html>
