<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wednesday - Türkçe Dublaj & Altyazılı İzle</title>
    
    <meta name="description" content="Wednesday 1. Sezon tüm bölümlerini yüksek kalitede izleyin.">
    <meta name="robots" content="index, follow">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            text-transform: uppercase;
        }

        header p {
            color: #888899;
            margin-top: 5px;
            font-size: 0.95rem;
        }

        /* --- Player Kapsayıcısı --- */
        .player-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            background-color: #000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(168, 85, 247, 0.2);
            margin-bottom: 25px;
        }

        /* --- Karga Görseli --- */
        .player-crow-overlay {
            position: absolute;
            top: -28px;              /* Player'ın tam üst kenarına tünemiş gibi */
            right: 20px;             /* Sağ üst köşe */
            width: 75px;             /* Boyut */
            height: auto;
            z-index: 20;             /* Videonun ve kontrollerin üzerinde kalsın */
            pointer-events: none;    /* Tıklamaları engellemesin */
            filter: drop-shadow(0px 6px 8px rgba(0, 0, 0, 0.7));
            transition: transform 0.3s ease;
        }

        video {
            width: 100%;
            display: block;
            border-radius: 12px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            outline: none;
        }

        /* --- Bölüm Seçim Alanı --- */
        .episodes-container {
            width: 100%;
            max-width: 900px;
            background: #16161f;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #282838;
        }

        .episodes-container h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #c084fc;
            border-bottom: 1px solid #282838;
            padding-bottom: 8px;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .episode-btn {
            background-color: #21212e;
            color: #ccc;
            border: 1px solid #33334d;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .episode-btn:hover {
            background-color: #2c2c3d;
            border-color: #a855f7;
            color: #fff;
        }

        .episode-btn.active {
            background-color: #6b21a8;
            border-color: #a855f7;
            color: #fff;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .player-crow-overlay { width: 55px; top: -20px; right: 10px; }
            .episodes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Wednesday</h1>
        <p>1. Sezon — Tüm Bölümler</p>
    </header>

    <div class="player-wrapper">
        <img src="https://raw.githubusercontent.com/chimeracoolstyle-hash/Wednesdayttr1.1/main/karga.png" 
             alt="Karga" 
             class="player-crow-overlay">

        <video id="mainPlayer" controls controlsList="nodownload" poster="">
            <source src="" type="video/mp4">
            Tarayıcınız video etiketini desteklemiyor.
        </video>
    </div>

    <div class="episodes-container">
        <h3>Bölümler</h3>
        <div class="episodes-grid" id="episodesList">
            </div>
    </div>

    <script>
        // Bölüm listesi ve video kaynakları
        const episodesData = [
            { id: 1, title: "1. Bölüm: Çarşamba Çocuğu Kederlidir", url: "https://ornek-link.com/bolum1.mp4" },
            { id: 2, title: "2. Bölüm: En Çok Keder Veren Yalnızlık", url: "https://ornek-link.com/bolum2.mp4" },
            { id: 3, title: "3. Bölüm: Dost mu Düşman mı?", url: "https://ornek-link.com/bolum3.mp4" },
            { id: 4, title: "4. Bölüm: Ne Kadar Kederli Bir Gece", url: "https://ornek-link.com/bolum4.mp4" },
            { id: 5, title: "5. Bölüm: Ektiğin Kederi Biçersin", url: "https://ornek-link.com/bolum5.mp4" }
        ];

        const player = document.getElementById('mainPlayer');
        const episodesList = document.getElementById('episodesList');

        // Bölüm butonlarını dinamik oluştur
        episodesData.forEach((ep, index) => {
            const btn = document.createElement('button');
            btn.className = `episode-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = ep.title;
            btn.onclick = () => loadEpisode(ep, btn);
            episodesList.appendChild(btn);
        });

        // İlk bölümü yükle
        if (episodesData.length > 0) {
            player.src = episodesData[0].url;
        }

        // Bölüm değiştirme fonksiyonu
        function loadEpisode(episode, buttonElement) {
            document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
            buttonElement.classList.add('active');
            
            player.src = episode.url;
            player.play();
        }
    </script>
</body>
</html>
