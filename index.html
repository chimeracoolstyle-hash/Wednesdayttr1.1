<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wednesday - Türkçe Dublaj İzle</title>
  <style>
    /* Genel Sayfa Ayarları */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f1015;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Başlık ve Bilgi Alanı */
    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 1.8rem;
      color: #e50914;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #a0a0a0;
    }

    /* Video Kapsayıcısı */
    .player-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border: 1px solid #23252e;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Bölüm Seçim Butonları */
    .episodes-section {
      width: 100%;
      max-width: 960px;
      margin-top: 30px;
    }

    .episodes-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #eaeaea;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .ep-btn {
      background-color: #1a1c24;
      color: #cfcfcf;
      border: 1px solid #2c2f3b;
      padding: 12px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: center;
    }

    .ep-btn:hover {
      background-color: #2c2f3b;
      color: #ffffff;
      border-color: #434758;
    }

    .ep-btn.active {
      background-color: #e50914;
      color: #ffffff;
      border-color: #e50914;
      box-shadow: 0 0 12px rgba(229, 9, 20, 0.4);
    }
  </style>
</head>
<body>

  <!-- Başlık -->
  <header>
    <h1>Wednesday</h1>
    <p class="subtitle" id="current-ep-title">1. Sezon 1. Bölüm</p>
  </header>

  <!-- Video Oynatıcı Alanı -->
  <div class="player-container">
    <iframe id="main-player" src="https://github.com/chimeracoolstyle-hash/Wednesdayttr1.1/releases/download/v1.0/Wednesday.1.Sezon.1.Bolum.izle.coolstylerip.mp4" allowfullscreen="true" scrolling="no"></iframe>
  </div>

  <!-- Bölüm Listesi -->
  <div class="episodes-section">
    <div class="episodes-title">Bölümler</div>
    <div class="episodes-grid">
      <button class="ep-btn active" onclick="changeEpisode('https://github.com/chimeracoolstyle-hash/Wednesdayttr1.1/releases/download/v1.0/Wednesday.1.Sezon.1.Bolum.izle.coolstylerip.mp4', '1. Sezon 1. Bölüm', this)">1. Bölüm</button>
      <button class="ep-btn" onclick="changeEpisode('BURAYA_2_BOLUM_LINKI', '1. Sezon 2. Bölüm', this)">2. Bölüm</button>
      <button class="ep-btn" onclick="changeEpisode('BURAYA_3_BOLUM_LINKI', '1. Sezon 3. Bölüm', this)">3. Bölüm</button>
      <button class="ep-btn" onclick="changeEpisode('BURAYA_4_BOLUM_LINKI', '1. Sezon 4. Bölüm', this)">4. Bölüm</button>
      <button class="ep-btn" onclick="changeEpisode('BURAYA_5_BOLUM_LINKI', '1. Sezon 5. Bölüm', this)">5. Bölüm</button>
    </div>
  </div>

  <!-- Bölüm Değiştirme Mantığı -->
  <script>
    function changeEpisode(videoUrl, episodeTitle, buttonElement) {
      // 1. Oynatıcı linkini güncelle
      document.getElementById('main-player').src = videoUrl;
      
      // 2. Başlığı güncelle
      document.getElementById('current-ep-title').textContent = episodeTitle;

      // 3. Aktif buton stilini ayarla
      const allButtons = document.querySelectorAll('.ep-btn');
      allButtons.forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');
    }
  </script>

</body>
</html>
